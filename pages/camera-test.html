<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>分紙拍照測試</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
            background: #111;
            color: #eee;
            font-size: 14px;
            line-height: 1.7;
        }

        h1 { font-size: 17px; margin: 0 0 12px; }

        button {
            font: inherit;
            width: 100%;
            padding: 14px;
            border: 1px solid #1769d6;
            background: #1769d6;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .note { font-size: 12.5px; color: #888; }
        #result { margin-top: 14px; }
        #result img { max-width: 100%; border: 1px solid #333; border-radius: 6px; }
        .meta { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9aa; }
    </style>
</head>

<body>
    <h1>分紙拍照測試</h1>

    <button id="open">開啟相機</button>

    <div class="note">
        這頁只是拿來單獨測拍照流程用的。畫面上會顯示偵測耗時與各角候選數，
        正式的 admin 上傳流程不會顯示這些數字。
    </div>

    <div id="result"></div>

    <script src="../js/scoresheet-camera.js"></script>
    <script>
        document.getElementById('open').onclick = async () => {
            const shot = await ScoresheetCamera.open({ showStats: true });
            const box = document.getElementById('result');
            if (!shot) {
                box.innerHTML = '<div class="note">已取消</div>';
                return;
            }
            box.innerHTML =
                `<div class="meta">${shot.width} x ${shot.height}，約 ${Math.round(shot.dataUrl.length / 1024)} KB</div>` +
                `<img src="${shot.dataUrl}" alt="">`;
        };
    </script>
</body>

</html>
